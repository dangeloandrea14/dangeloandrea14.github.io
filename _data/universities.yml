# Institutions where I have taught.
#
# Order matters: the Teaching page renders the institution wall in this order
# (most recent affiliation first). The key must match the `university_key`
# front-matter field of the entries in _teaching/.
#
# logo   — wide lockup or seal, shown on the institution plate
# mark   — compact square-ish mark, shown as the chip on each course row
# tint   — institutional colour; drives the plate's top rail and active state
# where  — optional; overrides the default "{city}, {country}" line
#
# Adding an institution: drop its logo in /images/logos/ and add a block here.
# The wall, the filter, the row chips and the counts all follow automatically.

au:
  name: "Aarhus University"
  full: "Aarhus University, Department of Computer Science"
  city: "Aarhus"
  country: "Denmark"
  flag: "🇩🇰"
  url: "https://cs.au.dk/"
  logo: "/images/au-logo-inv.svg"      # the dark seal already in /images, reused
  mark: "/images/au-logo-inv.svg"
  logo_height: 64
  tint: "#003d73"
  tint_dark: "#6ea8e0"

