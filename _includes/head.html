{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Apply the saved theme BEFORE the stylesheet paints, to avoid a
     flash of the light theme on every navigation (data-theme is
     otherwise set late by jQuery in _main.js). Mirrors that logic. -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var dark = s === 'dark' ||
        ((s === 'system' || !s) && window.matchMedia &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
    } catch (e) {}
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
